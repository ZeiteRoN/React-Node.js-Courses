<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>SVG Основи: Фігури та Анімація</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<svg width="600" height="200" viewBox="0 0 600 200">
    <rect x="20" y="50" width="80" height="80"
          fill="#3498db" stroke="#2980b9" stroke-width="5" />
    <rect x="140" y="50" width="120" height="80"
          fill="#2ecc71" stroke="#27ae60" stroke-width="5" />
    <circle cx="350" cy="90" r="45"
            class="animated-circle" stroke-width="5" />
    <ellipse cx="510" cy="90" rx="60" ry="40"
             fill="#e74c3c" stroke="#c0392b" stroke-width="5" />
</svg>
</body>
</html>
