<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <title>Практична робота</title>

    <style>
        .box {
            border: 1px solid #999;
            background-color: #f1f1f1;
            padding: 20px;
            margin-bottom: 15px;
        }

        .carousel img {
            height: 300px;
            object-fit: cover;
        }

        footer {
            background-color: #d9d9d9;
            text-align: center;
            padding: 20px;
            margin-top: 15px;
        }
    </style>
</head>
<body>

<div class="container-fluid">
    <header class="box">
        <h2>HEADER</h2>
        <ul class="nav mb-3">

            <li class="nav-item">
                <a href="#" class="nav-link">Home</a>
            </li>

            <li class="nav-item">
                <a href="#" class="nav-link">News</a>
            </li>

            <li class="nav-item">
                <a href="#" class="nav-link">Contacts</a>
            </li>
        </ul>

        <ul class="nav bg-dark p-2">

            <li class="nav-item">
                <a href="#" class="nav-link text-white">HTML</a>
            </li>

            <li class="nav-item">
                <a href="#" class="nav-link text-white">CSS</a>
            </li>

            <li class="nav-item">
                <a href="#" class="nav-link text-white">Bootstrap</a>
            </li>
        </ul>
    </header>

    <div class="row">
        <aside class="col-lg-3 col-md-6 col-12">
            <div class="box">
                <h3>LEFT</h3>
                <div id="slider" class="carousel slide">
                    <div class="carousel-inner">

                        <div class="carousel-item active">
                            <img src="https://picsum.photos/300/500?1"
                                 class="d-block w-100"
                                 alt="">
                        </div>

                        <div class="carousel-item">
                            <img src="https://picsum.photos/300/500?2"
                                 class="d-block w-100"
                                 alt="">
                        </div>

                        <div class="carousel-item">
                            <img src="https://picsum.photos/300/500?3"
                                 class="d-block w-100"
                                 alt="">
                        </div>

                        <div class="carousel-item">
                            <img src="https://picsum.photos/300/500?4"
                                 class="d-block w-100"
                                 alt="">
                        </div>
                    </div>

                    <button class="carousel-control-prev"
                            type="button"
                            data-bs-target="#slider"
                            data-bs-slide="prev">

                        <span class="carousel-control-prev-icon"></span>
                    </button>

                    <button class="carousel-control-next"
                            type="button"
                            data-bs-target="#slider"
                            data-bs-slide="next">
                        <span class="carousel-control-next-icon"></span>
                    </button>
                </div>
            </div>
        </aside>

        <main class="col-lg-6 col-md-6 col-12">
            <div class="box">
                <h3>MAIN</h3>
                <div class="accordion" id="accordionExample">
                    <div class="accordion-item">
                        <h2 class="accordion-header">
                            <button class="accordion-button"
                                    type="button"
                                    data-bs-toggle="collapse"
                                    data-bs-target="#item1">
                                Section 1
                            </button>
                        </h2>

                        <div id="item1"
                             class="accordion-collapse collapse show">
                            <div class="accordion-body">
                                Information for section 1.
                            </div>
                        </div>
                    </div>

                    <div class="accordion-item">
                        <h2 class="accordion-header">
                            <button class="accordion-button collapsed"
                                    type="button"
                                    data-bs-toggle="collapse"
                                    data-bs-target="#item2">
                                Section 2
                            </button>
                        </h2>

                        <div id="item2"
                             class="accordion-collapse collapse">
                            <div class="accordion-body">
                                Information for section 2.
                            </div>
                        </div>
                    </div>
                </div>

                <form class="mt-4">

                    <label class="form-label">Name</label>
                    <input type="text" class="form-control mb-3">

                    <label class="form-label">Email</label>
                    <input type="email" class="form-control mb-3">

                    <label class="form-label">Phone</label>
                    <input type="text" class="form-control mb-3">

                    <label class="form-label">City</label>
                    <input type="text" class="form-control mb-3">

                    <label class="form-label">Message</label>
                    <textarea class="form-control mb-3"></textarea>

                    <button type="submit"
                            class="btn btn-primary">
                        Send
                    </button>

                    <button type="reset"
                            class="btn btn-secondary">
                        Reset
                    </button>
                </form>
            </div>
        </main>

        <aside class="col-lg-3 col-12">
            <div class="box">
                <h3>RIGHT</h3>
                <p>
                    Additional information.
                </p>
            </div>
        </aside>

    </div>

    <footer>
        FOOTER
    </footer>

</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
