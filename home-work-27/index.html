<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Slider</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="slider">

    <div class="slides">
        <div class="slide active">
            <img src="1.jpg" alt="1">
        </div>

        <div class="slide">
            <img src="2.jpg" alt="2">
        </div>

        <div class="slide">
            <img src="3.jpg" alt="3">
        </div>

        <div class="slide">
            <img src="4.jpg" alt="4">
        </div>

    </div>

    <button class="prev">&#10094;</button>
    <button class="next">&#10095;</button>

    <button class="playPause">
        Pause
    </button>

    <div class="dots"></div>

</div>

<script src="main.js"></script>

</body>
</html>
